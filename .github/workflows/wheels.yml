name: Build and Publish Python Wheels

on:
  push:
    branches: [pynigiri]
    tags:
      - 'v*'
  pull_request:
    branches: [pynigiri]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            cibw_archs: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            cibw_archs: aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs }}
          CIBW_BUILD_VERBOSITY: 3
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >
            CMAKE_ARGS="-DPYTHON_BINDING=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DNO_BUILDCACHE=ON -DNIGIRI_BUILD_TOOLS=OFF -DNIGIRI_BUILD_TESTS=OFF"
            CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
            PATH=/opt/rh/gcc-toolset-14/root/usr/bin:$PATH
            LDFLAGS="-lpthread -ldl"
          CIBW_BEFORE_BUILD_LINUX: >
            yum install -y openssl-devel python3-devel gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ gcc-toolset-14-libatomic-devel
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        with:
          package-dir: ./python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist ./python

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
