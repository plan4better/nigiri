name: Build C++ Binaries

on:
  push:
    branches: [pynigiri]
    tags:
      - 'v*'
  pull_request:
    branches: [pynigiri]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build libssl-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DNIGIRI_BUILD_TOOLS=ON \
            -DNIGIRI_BUILD_TESTS=OFF \
            -DNO_BUILDCACHE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/{lib,bin,include}
          cp build/libnigiri.a dist/lib/ || cp build/libnigiri.so dist/lib/ || true
          cp build/libgtfsrt.a dist/lib/ || cp build/libgtfsrt.so dist/lib/ || true
          cp -r include/nigiri dist/include/
          cp -r build/generated/gtfsrt dist/include/
          cp build/nigiri-import dist/bin/
          cp build/nigiri-benchmark dist/bin/
          cp build/nigiri-qa dist/bin/
          tar -czf nigiri-cpp-linux-${{ matrix.arch }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: nigiri-cpp-linux-${{ matrix.arch }}
          path: nigiri-cpp-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Update latest-cpp release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/pynigiri'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nigiri-cpp-linux-*
          path: assets
          merge-multiple: true

      - name: Update rolling latest-cpp release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-cpp --yes || true
          git tag -f latest-cpp
          git push -f origin latest-cpp
          gh release create latest-cpp assets/*.tar.gz \
            --title "Latest C++ Build" \
            --notes "Rolling release from \`pynigiri\` branch. Updated on $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA::8}." \
            --prerelease
