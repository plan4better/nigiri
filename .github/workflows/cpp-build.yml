name: Build C++ SDK

on:
  push:
    branches: [pynigiri]
    tags:
      - 'v*'
  pull_request:
    branches: [pynigiri]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y bash build-essential cmake ninja-build git curl pkg-config libssl-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNIGIRI_BUILD_TOOLS=ON \
            -DNIGIRI_BUILD_TESTS=OFF \
            -DNO_BUILDCACHE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify ABI compatibility
        run: |
          echo "=== Checking for _M_replace_cold (GCC 13+ symbol) ==="
          FAIL=0
          for f in $(find build -name '*.a'); do
            if nm -C "$f" 2>/dev/null | grep -q '_M_replace_cold'; then
              echo "FAIL: $(basename $f) references _M_replace_cold"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "OK: No _M_replace_cold references found"
          else
            echo "ERROR: ABI incompatible with Bookworm libstdc++"
            exit 1
          fi

      - name: Package SDK
        run: |
          set -euo pipefail
          SDK_DIR="$(mktemp -d)"
          mkdir -p "$SDK_DIR/lib" "$SDK_DIR/include" "$SDK_DIR/bin"

          # 1. Static libraries — collect every .a from the build tree
          find build -name '*.a' -exec cp {} "$SDK_DIR/lib/" \;

          # 2. Nigiri public headers
          cp -r include/nigiri "$SDK_DIR/include/"

          # 3. Generated protobuf headers
          cp -r build/generated/gtfsrt "$SDK_DIR/include/"

          # 4. Dependency headers — standard layout (deps/X/include/...)
          for dep in cista geo fmt date utl unordered_dense oh sol2 PEGTL; do
            if [ -d "deps/$dep/include" ]; then
              cp -r deps/$dep/include/* "$SDK_DIR/include/"
            fi
          done

          # opentelemetry has api + sdk split
          for sub in api sdk; do
            if [ -d "deps/opentelemetry-cpp/$sub/include" ]; then
              cp -r deps/opentelemetry-cpp/$sub/include/* "$SDK_DIR/include/"
            fi
          done

          # Dependency headers — non-standard layouts
          [ -d "deps/boost/boost" ] && cp -r deps/boost/boost "$SDK_DIR/include/boost"
          for f in deps/pugixml/src/*.hpp; do [ -f "$f" ] && cp "$f" "$SDK_DIR/include/"; done
          [ -f "deps/miniz/miniz.h" ] && cp deps/miniz/miniz.h "$SDK_DIR/include/"
          [ -f "deps/wyhash/wyhash.h" ] && cp deps/wyhash/wyhash.h "$SDK_DIR/include/"
          [ -f "deps/tg/tg.h" ] && cp deps/tg/tg.h "$SDK_DIR/include/"
          [ -f "deps/rtree.c/rtree.h" ] && cp deps/rtree.c/rtree.h "$SDK_DIR/include/"

          # 5. Executables
          for bin in nigiri-import nigiri-benchmark nigiri-qa; do
            [ -f "build/$bin" ] && cp "build/$bin" "$SDK_DIR/bin/"
          done

          # 6. Package
          tar -czf nigiri-sdk-linux-${{ matrix.arch }}.tar.gz -C "$SDK_DIR" .
          rm -rf "$SDK_DIR"

          # 7. Verify contents
          echo "=== Static libraries ==="
          tar tzf nigiri-sdk-linux-${{ matrix.arch }}.tar.gz | grep '\.a$' | wc -l
          echo "=== Key transitive headers ==="
          tar tzf nigiri-sdk-linux-${{ matrix.arch }}.tar.gz | grep -E '(cista/memory_holder|geo/latlng|fmt/ostream|date/date)\.h' || echo "WARNING: missing expected headers"

      - uses: actions/upload-artifact@v4
        with:
          name: nigiri-sdk-linux-${{ matrix.arch }}
          path: nigiri-sdk-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Update latest-cpp release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/pynigiri'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nigiri-sdk-linux-*
          path: assets
          merge-multiple: true

      - name: Update rolling latest-cpp release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-cpp --yes || true
          git tag -f latest-cpp
          git push -f origin latest-cpp
          gh release create latest-cpp assets/*.tar.gz \
            --title "Latest C++ SDK" \
            --notes "Rolling SDK release from \`pynigiri\` branch (Bookworm ABI). Updated on $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA::8}.

          Contains:
          - Static libraries (libnigiri.a + all dependencies, GCC 12 / Bookworm ABI)
          - Headers (nigiri + all transitive dependency headers)
          - CLI tools (nigiri-import, nigiri-benchmark, nigiri-qa)" \
            --prerelease
