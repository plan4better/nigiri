name: Build Python Wheels

on:
  push:
    branches: [pynigiri]
    tags:
      - 'v*'
  pull_request:
    branches: [pynigiri]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cibw_archs: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            cibw_archs: aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs }}
          CIBW_BUILD_VERBOSITY: 3
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >
            CMAKE_ARGS="-DPYTHON_BINDING=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DNO_BUILDCACHE=ON -DNIGIRI_BUILD_TOOLS=OFF -DNIGIRI_BUILD_TESTS=OFF"
            CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
            PATH=/opt/rh/gcc-toolset-14/root/usr/bin:$PATH
            LDFLAGS="-lpthread -ldl"
          CIBW_BEFORE_BUILD_LINUX: >
            yum install -y openssl-devel python3-devel gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ gcc-toolset-14-libatomic-devel
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        with:
          package-dir: ./python

      - uses: actions/upload-artifact@v4
        with:
          name: nigiri-python-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist ./python

      - uses: actions/upload-artifact@v4
        with:
          name: nigiri-python-sdist
          path: python/dist/*.tar.gz

  release:
    name: Update latest-python release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/pynigiri'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nigiri-python-*
          path: assets
          merge-multiple: true

      - name: Update rolling latest-python release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-python --yes || true
          git tag -f latest-python
          git push -f origin latest-python
          gh release create latest-python assets/* \
            --title "Latest Python Build" \
            --notes "Rolling release from \`pynigiri\` branch. Updated on $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA::8}." \
            --prerelease
